name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The changelog is drafted from commit subjects (npm run changelog:draft), so a
  # subject that does not parse is a changelog entry that silently goes missing.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit subjects are conventional
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bad=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" \
              | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'; then
              echo "Not a conventional commit subject: $subject" >&2
              bad=1
            fi
          done < <(git log --no-merges --pretty=%s "$BASE..HEAD")
          if [ "$bad" -ne 0 ]; then
            echo 'Expected e.g. "feat(chart): draw the aspect web". See docs/RELEASING.md.' >&2
            exit 1
          fi
          echo 'All commit subjects parse.'

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The ephemeris data files are not committed. Syncing verifies each against
      # its pinned SHA-256, so this step fails if upstream repacked the package —
      # which would mean different numbers from the same version.
      - name: Sync and verify ephemeris assets
        run: npm run ephe:sync

      # The build inlines whatever public/ contains; without this the built
      # app would 404 fetching its interpretation text.
      - name: Split corpus into runtime chunks
        run: npm run corpus:split

      # Swiss Ephemeris constants are generated from a live instance, never
      # transcribed. Drift here means the committed constants no longer match the
      # library actually being called.
      - name: Check generated constants are current
        run: node scripts/gen-constants.mjs --check

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # Includes the golden-chart gate: 11 bodies at 3 epochs against JPL Horizons
      # reference values, 0.2" for historical dates. Runs fully offline.
      - run: npm test

      - run: npm run build
