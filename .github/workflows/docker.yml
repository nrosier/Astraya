name: Docker

# Builds the single Astraya image and publishes it to Docker Hub.
#
# Tagging strategy (docs/RELEASING.md):
#   v1.2.3 tag  ->  1.2.3, 1.2, 1, latest   (a user can pin as loosely as they like)
#   pull request->  built and smoke-tested, never pushed (a fork PR has no access to
#                                            the secrets anyway, and must not gain
#                                            any) — amd64-only so the image can be
#                                            `load`ed locally to run it
#
# Prereleases (v1.2.3-rc.1) get their literal tag only: `latest` and the rolling
# major/minor tags must never move to something not meant for general use.

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      moved-latest: ${{ steps.latest.outputs.tags != '' }}
    steps:
      - uses: actions/checkout@v7

      # A pull request from a fork gets no secrets, so the image name cannot be
      # built from DOCKERHUB_USERNAME there. Building is still worth doing on a fork
      # PR — a broken Dockerfile should fail review, not the merge — so fall back to
      # a placeholder owner. Nothing is pushed on a pull request either way, and an
      # absent secret must not turn into a confusing `/astraya` parse failure.
      - name: Resolve the image name
        id: image
        env:
          OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${OWNER:-fork-pr-build}/astraya" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # A pull request builds to verify the Dockerfile still works, and stops there.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          # `flavor`, not `flags`: the latter is not an input this action has, so it
          # was accepted in silence and metadata-action kept its default
          # `latest=auto`. That meant two things generated `latest` — its default and
          # the explicit step below — and they only happened to agree because no
          # prerelease has been tagged yet.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Astraya
            org.opencontainers.image.description=Astrological calculation and charting, computed locally
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # `latest` is set here rather than by metadata-action's `auto` behaviour,
      # which would also move it for a prerelease tag. This is the only thing that
      # sets it; `flavor: latest=false` above is what makes that true.
      - name: Decide whether this moves `latest`
        id: latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi

      # A multi-platform build cannot be `load`ed into the local daemon — only a
      # single-platform one can — so a pull request (which has nowhere to push, but
      # still needs to actually run the image below) builds amd64 only and loads it
      # instead of pushing it. A tag push builds both platforms and pushes as before.
      - name: Build ${{ github.event_name == 'pull_request' && '(amd64, local)' || 'and push' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.latest.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # A pushed image that cannot serve a request is worse than a failed build,
      # because it looks like a success — and the same is true one step earlier, of
      # an image that merges fine but never actually gets run. This starts the
      # amd64 image just built (pushed on a tag, `load`ed locally on a PR) and waits
      # for the app's own health endpoint.
      - name: Smoke-test the image
        run: |
          # The first metadata tag: the release version. It used to be `latest`,
          # before `flavor` stopped that being generated here; either is a valid
          # thing to smoke-test, but the version is the more precise one.
          tag="$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name astraya-smoke -p 8080:8080 "$tag"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              curl -fsS -I http://127.0.0.1:8080/ | grep -i 'content-security-policy' > /dev/null \
                || { echo 'No CSP header on the served index.' >&2; exit 1; }
              echo "Image $tag serves and sets its security headers."
              docker rm -f astraya-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo 'Image never became healthy. Logs:' >&2
          docker logs astraya-smoke >&2
          exit 1

  # Only runs on a tag push that actually moved `latest` (a prerelease tag
  # doesn't — see the `image` job's `Decide whether this moves latest` step —
  # and Harbor's replication policy here only pulls the `latest` tag, so
  # there'd be nothing new to scan otherwise). Assumes Harbor already has a
  # pull-based replication policy pointed at this Docker Hub repo — this job
  # triggers that policy's execution rather than pushing the image again
  # itself, then triggers Harbor's own vulnerability scan once the replicated
  # artifact has landed.
  #
  # Repo settings required (Settings -> Secrets and variables -> Actions):
  #   Secrets: HARBOR_ROBOT_USER, HARBOR_ROBOT_TOKEN
  #     A robot account scoped to just this Harbor project, not an admin login.
  #     It needs Replication (create + read) at system level, and Scan (create)
  #     on the target project.
  #   Variables: HARBOR_URL (e.g. https://harbor.example.com, no trailing slash),
  #     HARBOR_PROJECT, HARBOR_REPOSITORY, HARBOR_REPLICATION_POLICY_ID
  #     (the numeric id of the existing Docker Hub -> Harbor replication policy).
  harbor-scan:
    name: Trigger Harbor replication + scan
    needs: image
    # Skips cleanly (rather than failing) until the repo variables below are
    # actually set, so this doesn't show a red X on every release in the
    # meantime.
    if: github.event_name != 'pull_request' && vars.HARBOR_URL != '' && needs.image.outputs.moved-latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Harbor replication from Docker Hub
        id: replicate
        env:
          HARBOR_URL: ${{ vars.HARBOR_URL }}
          HARBOR_REPLICATION_POLICY_ID: ${{ vars.HARBOR_REPLICATION_POLICY_ID }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
        run: |
          # Harbor returns the new execution's id via a Location header
          # (.../replication/executions/<id>), not in the response body.
          id="$(curl -fsS -u "$HARBOR_ROBOT_USER:$HARBOR_ROBOT_TOKEN" \
            -X POST "$HARBOR_URL/api/v2.0/replication/executions" \
            -H 'Content-Type: application/json' \
            -d "{\"policy_id\": $HARBOR_REPLICATION_POLICY_ID}" \
            -D - -o /dev/null | grep -i '^Location:' | grep -o '[0-9]*$' | tr -d '\r')"
          if [[ -z "$id" ]]; then
            echo 'Harbor did not return a replication execution id.' >&2
            exit 1
          fi
          echo "execution_id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for the replication to finish
        env:
          HARBOR_URL: ${{ vars.HARBOR_URL }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          EXECUTION_ID: ${{ steps.replicate.outputs.execution_id }}
        run: |
          for _ in $(seq 1 60); do
            status="$(curl -fsS -u "$HARBOR_ROBOT_USER:$HARBOR_ROBOT_TOKEN" \
              "$HARBOR_URL/api/v2.0/replication/executions/$EXECUTION_ID" | jq -r '.status')"
            case "$status" in
              Succeed)
                echo "Replication execution $EXECUTION_ID succeeded."
                exit 0
                ;;
              Failed | Stopped)
                echo "Replication execution $EXECUTION_ID ended as $status." >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Replication execution $EXECUTION_ID never finished within 5 minutes." >&2
          exit 1

      - name: Trigger a vulnerability scan
        env:
          HARBOR_URL: ${{ vars.HARBOR_URL }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          HARBOR_REPOSITORY: ${{ vars.HARBOR_REPOSITORY }}
          HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          # The replication policy only pulls `latest`, so that's the only tag
          # that's ever actually present to scan on the Harbor side.
          TAG: latest
        run: |
          curl -fsS -u "$HARBOR_ROBOT_USER:$HARBOR_ROBOT_TOKEN" \
            -X POST "$HARBOR_URL/api/v2.0/projects/$HARBOR_PROJECT/repositories/$HARBOR_REPOSITORY/artifacts/$TAG/scan" \
            -H 'Content-Type: application/json'
          echo "Scan triggered for $HARBOR_PROJECT/$HARBOR_REPOSITORY:$TAG"
