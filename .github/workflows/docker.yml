name: Docker

# Builds the single Astraya image and publishes it to Docker Hub.
#
# Tagging strategy (docs/RELEASING.md):
#   v1.2.3 tag  ->  1.2.3, 1.2, 1, latest   (a user can pin as loosely as they like)
#   main push   ->  edge, sha-<short>       (never `latest`; main is not a release)
#   pull request->  built, never pushed     (a fork PR has no access to the secrets
#                                            anyway, and must not gain any)
#
# Prereleases (v1.2.3-rc.1) get their literal tag only: `latest` and the rolling
# major/minor tags must never move to something not meant for general use.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A pull request from a fork gets no secrets, so the image name cannot be
      # built from DOCKERHUB_USERNAME there. Building is still worth doing on a fork
      # PR — a broken Dockerfile should fail review, not the merge — so fall back to
      # a placeholder owner. Nothing is pushed on a pull request either way, and an
      # absent secret must not turn into a confusing `/astraya` parse failure.
      - name: Resolve the image name
        id: image
        env:
          OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${OWNER:-fork-pr-build}/astraya" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      # A pull request builds to verify the Dockerfile still works, and stops there.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=short,enable={{is_default_branch}}
          # `flavor`, not `flags`: the latter is not an input this action has, so it
          # was accepted in silence and metadata-action kept its default
          # `latest=auto`. That meant two things generated `latest` — its default and
          # the explicit step below — and they only happened to agree because no
          # prerelease has been tagged yet.
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Astraya
            org.opencontainers.image.description=Astrological calculation and charting, computed locally
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # `latest` is set here rather than by metadata-action's `auto` behaviour,
      # which would also move it for a prerelease tag. This is the only thing that
      # sets it; `flavor: latest=false` above is what makes that true.
      - name: Decide whether this moves `latest`
        id: latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.latest.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # A pushed image that cannot serve a request is worse than a failed build,
      # because it looks like a success. This starts the amd64 image we just
      # published and waits for the app's own health endpoint.
      - name: Smoke-test the published image
        if: github.event_name != 'pull_request'
        run: |
          # The first metadata tag, which is the version on a release and `edge` on
          # main. It used to be `latest`, before `flavor` stopped that being
          # generated here; either is a valid thing to smoke-test, but the version is
          # the more precise one.
          tag="$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run -d --name astraya-smoke -p 8080:8080 "$tag"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              curl -fsS -I http://127.0.0.1:8080/ | grep -i 'content-security-policy' > /dev/null \
                || { echo 'No CSP header on the served index.' >&2; exit 1; }
              echo "Image $tag serves and sets its security headers."
              docker rm -f astraya-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo 'Image never became healthy. Logs:' >&2
          docker logs astraya-smoke >&2
          exit 1
